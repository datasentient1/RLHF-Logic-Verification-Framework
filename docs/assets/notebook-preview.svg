  <text x="96" y="210" fill="#7A5B00" font-size="17" font-family="Arial, Helvetica, sans-serif">Colab-first workflow: install repo, mount Drive, configure DVC + MLflow, run verifier demo, prepare for LoRA/QLoRA.</text>

  <rect x="72" y="254" width="1056" height="124" rx="18" fill="#F5F8FE" stroke="#B6CAE8"/>
  <rect x="92" y="276" width="84" height="28" rx="10" fill="#D9E7FB"/>
  <text x="112" y="296" fill="#2D5B9B" font-size="16" font-family="Arial, Helvetica, sans-serif" font-weight="700">Code</text>
  <text x="96" y="330" fill="#1F2A37" font-size="20" font-family="Courier New, monospace">from verifier_guided_reasoning.pipeline import run_small_demo</text>
  <text x="96" y="360" fill="#1F2A37" font-size="20" font-family="Courier New, monospace">summary = run_small_demo(..., tracker_root="/content/drive/.../mlruns")</text>

  <rect x="72" y="402" width="1056" height="142" rx="18" fill="#EFFAF2" stroke="#A8D5B2"/>
