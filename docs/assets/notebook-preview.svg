  <text x="96" y="666" fill="#5B1D27" font-size="17" font-family="Arial, Helvetica, sans-serif">2. Mount Drive</text>
  <text x="280" y="642" fill="#5B1D27" font-size="17" font-family="Arial, Helvetica, sans-serif">3. Configure DVC</text>
  <text x="280" y="666" fill="#5B1D27" font-size="17" font-family="Arial, Helvetica, sans-serif">4. Run demo</text>

