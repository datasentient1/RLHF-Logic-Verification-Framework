  <text x="96" y="472" fill="#1D4330" font-size="22" font-family="Courier New, monospace">{'final_accuracy': 1.0, 'pass_rate': 0.75, 'num_traces': 2}</text>
  <text x="96" y="506" fill="#1D4330" font-size="18" font-family="Arial, Helvetica, sans-serif">The notebook is an orchestrator, not the source of truth. Core logic lives in importable Python modules.</text>

  <rect x="72" y="574" width="510" height="116" rx="18" fill="#FFF1F2" stroke="#F0B5BD"/>
