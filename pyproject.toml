[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "verifier-guided-reasoning"
version = "0.1.0"
description = "Verifier-guided process supervision scaffold for reasoning models"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [
  {name = "Nicholas Williams"}
]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]
colab = [
  "accelerate>=1.0.0",
  "datasets>=2.19.0",
  "dvc>=3.50.0",
  "mlflow>=2.16.0",
  "peft>=0.11.0",
  "transformers>=4.37.0",
  "trl>=0.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
